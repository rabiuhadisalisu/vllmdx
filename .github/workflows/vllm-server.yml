name: 🚀 vLLM LLM Server

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "HuggingFace model ID"
        required: false
        default: "Qwen/Qwen2.5-1.5B-Instruct"
        type: string
      max_model_len:
        description: "Max context length (tokens)"
        required: false
        default: "2048"
        type: string
      session_hours:
        description: "Session length in hours (max 5.75)"
        required: false
        default: "5.75"
        type: string
      tunnel_mode:
        description: "Tunnel type"
        required: false
        default: "quick"
        type: choice
        options:
          - quick
          - named

env:
  MODEL_ID:      ${{ github.event.inputs.model_id      || 'Qwen/Qwen2.5-1.5B-Instruct' }}
  MAX_MODEL_LEN: ${{ github.event.inputs.max_model_len || '2048' }}
  SESSION_HOURS: ${{ github.event.inputs.session_hours || '5.75' }}
  TUNNEL_MODE:   ${{ github.event.inputs.tunnel_mode   || 'quick' }}
  VLLM_PORT:     8000

  # ── CRITICAL: Force CPU device BEFORE vLLM initializes ──────────────────
  # Without this vllm crashes at config.__post_init__ before even parsing args
  VLLM_TARGET_DEVICE: cpu

jobs:
  serve:
    name: "🤖 LLM Server"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

    # ── 0. Session info ───────────────────────────────────────────────────────
    - name: 📋 Session Info
      run: |
        echo "=================================================="
        echo "  vLLM CPU Server — GitHub Actions"
        echo "=================================================="
        echo "  Model         : $MODEL_ID"
        echo "  Max ctx len   : $MAX_MODEL_LEN tokens"
        echo "  Session limit : ${SESSION_HOURS}h"
        echo "  Runner OS     : $(uname -srm)"
        echo "  RAM           : $(free -h | awk '/^Mem:/{print $2}')"
        echo "  CPU           : $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
        echo "  CPU cores     : $(nproc)"
        echo "  Disk free     : $(df -h / | awk 'NR==2{print $4}')"
        echo "=================================================="

        # Compute session seconds for keep-alive loop
        TIMEOUT_SECS=$(echo "$SESSION_HOURS * 3600" | bc | cut -d. -f1)
        echo "TIMEOUT_SECS=$TIMEOUT_SECS" >> $GITHUB_ENV
        echo "  Auto-shutdown in ${TIMEOUT_SECS}s"

        # CPU thread math — reserve 2 cores for the HTTP layer
        TOTAL_CORES=$(nproc)
        INFERENCE_CORES=$((TOTAL_CORES > 2 ? TOTAL_CORES - 2 : 1))
        RAM_GB=$(free -g | awk '/^Mem:/{print $2}')
        KV_CACHE_GB=$((RAM_GB > 3 ? RAM_GB / 3 : 1))

        echo "INFERENCE_CORES=$INFERENCE_CORES"       >> $GITHUB_ENV
        echo "TOTAL_CORES=$TOTAL_CORES"               >> $GITHUB_ENV
        echo "KV_CACHE_GB=$KV_CACHE_GB"               >> $GITHUB_ENV

        echo "  Inference threads : $INFERENCE_CORES / $TOTAL_CORES"
        echo "  KV cache budget   : ${KV_CACHE_GB}GB"

    # ── 1. Checkout ───────────────────────────────────────────────────────────
    - name: 📥 Checkout
      uses: actions/checkout@v4

    # ── 2. Python setup ───────────────────────────────────────────────────────
    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ── 3. Cache pip ──────────────────────────────────────────────────────────
    - name: 🗃️ Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-vllm-cpu-v1
        restore-keys: ${{ runner.os }}-pip-vllm-cpu-

    # ── 4. Cache HuggingFace weights ──────────────────────────────────────────
    - name: 🗃️ Cache HuggingFace weights
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ env.MODEL_ID }}-${{ env.MAX_MODEL_LEN }}
        restore-keys: hf-${{ env.MODEL_ID }}-

    # ── 5. Install system deps ────────────────────────────────────────────────
    - name: 📦 Install System Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          curl jq bc libnuma-dev libgomp1 numactl 2>/dev/null
        echo "[✓] System deps ready"

    # ── 6. Install vLLM (CPU) — 3-method fallback chain ──────────────────────
    - name: ⚙️ Install vLLM for CPU
      run: |
        pip install --upgrade pip -q
        echo "[→] Attempting vLLM CPU install..."

        INSTALLED=false

        # ── Method 1: community vllm-cpu from PyPI ────────────────────────
        # Re-packages upstream wheel with fixed glibc (manylinux_2_28)
        # Auto-detects AVX2 / AVX512 / AMX at import time — no manual ISA selection
        echo ""
        echo "  [1/3] pip install vllm-cpu ..."
        if pip install vllm-cpu --quiet 2>&1 | tee /tmp/install_m1.log; then
          echo "  [✓] Method 1 succeeded: vllm-cpu (PyPI)"
          INSTALLED=true
        else
          echo "  [✗] Method 1 failed:"
          tail -5 /tmp/install_m1.log
        fi

        # ── Method 2: upstream GitHub Releases wheel (direct URL) ─────────
        # Bypasses the PEP 440 +cpu local-suffix PyPI block by installing directly
        if [[ "$INSTALLED" == "false" ]]; then
          echo ""
          echo "  [2/3] Upstream GitHub Releases CPU wheel..."
          ARCH=$(uname -m)   # x86_64 or aarch64

          LATEST_VER=$(curl -sf \
            "https://api.github.com/repos/vllm-project/vllm/releases/latest" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['tag_name'].lstrip('v'))" \
            2>/dev/null || echo "0.29.0")

          WHEEL_URL="https://github.com/vllm-project/vllm/releases/download/v${LATEST_VER}/vllm-${LATEST_VER}+cpu-cp38-abi3-manylinux_2_28_${ARCH}.whl"
          echo "    URL: $WHEEL_URL"

          if pip install "$WHEEL_URL" \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              --quiet 2>&1 | tee /tmp/install_m2.log; then
            echo "  [✓] Method 2 succeeded: upstream wheel v${LATEST_VER}"
            INSTALLED=true
          else
            echo "  [✗] Method 2 failed:"
            tail -5 /tmp/install_m2.log
          fi
        fi

        # ── Method 3: llama-cpp-python OpenAI server (nuclear fallback) ───
        # Fully self-contained, works on any Linux CPU, uses GGUF models
        # Same /v1/chat/completions + /v1/models API surface as vLLM
        if [[ "$INSTALLED" == "false" ]]; then
          echo ""
          echo "  [3/3] Falling back to llama-cpp-python[server]..."
          pip install \
            "llama-cpp-python[server]" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            --quiet
          echo "  [✓] Method 3 succeeded: llama-cpp-python"
          echo "BACKEND_ENGINE=llamacpp" >> $GITHUB_ENV
        fi

        # ── Verify ────────────────────────────────────────────────────────
        echo ""
        echo "=== Verification ==="
        if [[ "${BACKEND_ENGINE:-vllm}" == "vllm" ]]; then
          python3 -c "
        import os
        os.environ['VLLM_TARGET_DEVICE'] = 'cpu'
        import vllm
        print(f'vLLM {vllm.__version__} — OK')
        "
        else
          python3 -c "import llama_cpp; print('llama-cpp-python — OK')"
        fi

    # ── 7. Install cloudflared ────────────────────────────────────────────────
    - name: ☁️ Install cloudflared
      run: |
        LATEST=$(curl -sf \
          https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
          | jq -r .tag_name)
        ARCH=$(uname -m)
        [[ "$ARCH" == "aarch64" ]] && CF_ARCH="arm64" || CF_ARCH="amd64"
        URL="https://github.com/cloudflare/cloudflared/releases/download/${LATEST}/cloudflared-linux-${CF_ARCH}"
        echo "[→] Downloading cloudflared ${LATEST}..."
        curl -fsSL "$URL" -o /usr/local/bin/cloudflared
        chmod +x /usr/local/bin/cloudflared
        echo "[✓] $(cloudflared --version)"

    # ── 8. Start vLLM / llama-cpp server ─────────────────────────────────────
    - name: 🚀 Start LLM Server
      env:
        HF_TOKEN:                  ${{ secrets.HF_TOKEN }}
        HUGGING_FACE_HUB_TOKEN:    ${{ secrets.HF_TOKEN }}
        VLLM_API_KEY:              ${{ secrets.VLLM_API_KEY }}
        # Force CPU device — this env var is read by vllm/config/device.py
        # __post_init__ BEFORE any CLI args are parsed. Must be set here.
        VLLM_TARGET_DEVICE:        cpu
        # CPU performance tuning
        OMP_NUM_THREADS:           ${{ env.INFERENCE_CORES }}
        MKL_NUM_THREADS:           ${{ env.INFERENCE_CORES }}
        VLLM_CPU_KVCACHE_SPACE:    ${{ env.KV_CACHE_GB }}
        VLLM_CPU_NUM_OF_RESERVED_CPU: "2"
      run: |
        if [[ "${BACKEND_ENGINE:-vllm}" == "llamacpp" ]]; then
          # ── llama-cpp-python fallback server ──────────────────────────
          echo "[→] Starting llama-cpp-python server..."
          echo "[!] Note: MODEL_ID must be a GGUF repo (e.g. Qwen/Qwen2.5-1.5B-Instruct-GGUF)"

          python3 -m llama_cpp.server \
            --model "$MODEL_ID" \
            --host 0.0.0.0 \
            --port "$VLLM_PORT" \
            --n_ctx "$MAX_MODEL_LEN" \
            --n_threads "$INFERENCE_CORES" \
            --chat_format chatml \
            > /tmp/vllm.log 2>&1 &

        else
          # ── vLLM CPU server ───────────────────────────────────────────
          echo "[→] Starting vLLM CPU server..."
          echo "    VLLM_TARGET_DEVICE = cpu"
          echo "    OMP_NUM_THREADS    = $INFERENCE_CORES"
          echo "    KV cache space     = ${KV_CACHE_GB}GB"

          vllm serve "$MODEL_ID" \
            --device cpu \
            --dtype bfloat16 \
            --host 0.0.0.0 \
            --port "$VLLM_PORT" \
            --max-model-len "$MAX_MODEL_LEN" \
            --trust-remote-code \
            --enable-prefix-caching \
            --uvicorn-log-level warning \
            --served-model-name "$(echo $MODEL_ID | sed 's|.*/||')" \
            > /tmp/vllm.log 2>&1 &
        fi

        VLLM_PID=$!
        echo "VLLM_PID=$VLLM_PID" >> $GITHUB_ENV
        echo "[✓] Server PID: $VLLM_PID"

    # ── 9. Wait for health ────────────────────────────────────────────────────
    - name: ⏳ Wait for Server Health
      run: |
        echo "[→] Waiting for health endpoint on :${VLLM_PORT}..."
        MAX_WAIT=480   # 8 min — CPU model load is slow
        INTERVAL=10
        ELAPSED=0

        while true; do
          # Check if process is still alive first
          if ! kill -0 "$VLLM_PID" 2>/dev/null; then
            echo ""
            echo "[✗] Server process died! Full log:"
            cat /tmp/vllm.log
            exit 1
          fi

          if curl -sf "http://localhost:$VLLM_PORT/health" &>/dev/null; then
            echo ""
            echo "[✓] Server is healthy! (${ELAPSED}s)"
            break
          fi

          if [[ $ELAPSED -ge $MAX_WAIT ]]; then
            echo "[✗] Timeout after ${MAX_WAIT}s. Last 30 lines:"
            tail -30 /tmp/vllm.log
            exit 1
          fi

          printf "  ... %ds / %ds — last log: %s\r" \
            "$ELAPSED" "$MAX_WAIT" \
            "$(tail -1 /tmp/vllm.log 2>/dev/null | cut -c1-60)"
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done

        echo ""
        echo "=== Loaded Models ==="
        curl -s "http://localhost:$VLLM_PORT/v1/models" | python3 -m json.tool

    # ── 10. Start Cloudflare Tunnel ───────────────────────────────────────────
    - name: 🌐 Start Cloudflare Tunnel
      env:
        CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      run: |
        if [[ "$TUNNEL_MODE" == "named" && -n "${CF_TUNNEL_TOKEN:-}" ]]; then
          echo "[→] Named tunnel..."
          cloudflared tunnel --no-autoupdate run \
            --token "$CF_TUNNEL_TOKEN" \
            > /tmp/cloudflared.log 2>&1 &
          sleep 5
          TUNNEL_URL="(your Cloudflare hostname)"
        else
          echo "[→] Quick tunnel (trycloudflare.com)..."
          cloudflared tunnel --no-autoupdate \
            --url "http://localhost:$VLLM_PORT" \
            > /tmp/cloudflared.log 2>&1 &

          # Wait up to 30s for URL to appear in log
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oP 'https://[a-z0-9\-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log 2>/dev/null | head -1 || true)
            [[ -n "$TUNNEL_URL" ]] && break
            sleep 1
          done
        fi

        echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
        CF_PID=$!
        echo "CF_PID=$CF_PID" >> $GITHUB_ENV

        echo ""
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║          🌐  LLM SERVER IS LIVE                      ║"
        echo "╠══════════════════════════════════════════════════════╣"
        printf  "║  URL    : %-43s║\n" "$TUNNEL_URL"
        printf  "║  API    : %-43s║\n" "$TUNNEL_URL/v1"
        printf  "║  Model  : %-43s║\n" "$MODEL_ID"
        echo "╚══════════════════════════════════════════════════════╝"

    # ── 11. Keep-alive loop ───────────────────────────────────────────────────
    - name: 🔄 Keep-Alive (auto-shutdown at timeout)
      run: |
        echo "[→] Keep-alive loop started — ${SESSION_HOURS}h / ${TIMEOUT_SECS}s"
        START=$(date +%s)
        LAST_HB=0

        while true; do
          NOW=$(date +%s)
          ELAPSED=$((NOW - START))
          REMAINING=$((TIMEOUT_SECS - ELAPSED))

          # Graceful shutdown when time expires
          [[ $REMAINING -le 0 ]] && {
            echo "⏰ Session timeout — shutting down."
            break
          }

          # Heartbeat every 5 min
          if [[ $((NOW - LAST_HB)) -ge 300 ]]; then
            E=$(printf "%02d:%02d:%02d" \
              $((ELAPSED/3600)) $(( (ELAPSED%3600)/60 )) $((ELAPSED%60)))
            R=$(printf "%02d:%02d:%02d" \
              $((REMAINING/3600)) $(( (REMAINING%3600)/60 )) $((REMAINING%60)))

            HEALTH="❌"
            curl -sf "http://localhost:$VLLM_PORT/health" &>/dev/null && HEALTH="✅"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ⏱  Elapsed   : $E"
            echo "  ⏳  Remaining : $R"
            echo "  🤖  Server    : $HEALTH"
            echo "  🌐  Endpoint  : $TUNNEL_URL/v1"
            echo "  💾  RAM       : $(free -h | awk '/^Mem:/{print $3 "/" $2}')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Watchdog: auto-restart if server died
            if ! kill -0 "$VLLM_PID" 2>/dev/null; then
              echo "[!] Server died — restarting..."
              VLLM_TARGET_DEVICE=cpu \
              OMP_NUM_THREADS="$INFERENCE_CORES" \
              VLLM_CPU_KVCACHE_SPACE="$KV_CACHE_GB" \
              vllm serve "$MODEL_ID" \
                --device cpu --dtype bfloat16 \
                --host 0.0.0.0 --port "$VLLM_PORT" \
                --max-model-len "$MAX_MODEL_LEN" \
                --trust-remote-code --enable-prefix-caching \
                >> /tmp/vllm.log 2>&1 &
              VLLM_PID=$!
              echo "VLLM_PID=$VLLM_PID" >> $GITHUB_ENV
            fi

            LAST_HB=$NOW
          fi

          sleep 15
        done

    # ── 12. Shutdown & upload logs ────────────────────────────────────────────
    - name: 🛑 Shutdown & Upload Logs
      if: always()
      run: |
        echo "[→] Stopping server..."
        [[ -n "${VLLM_PID:-}" ]] && kill -SIGTERM "$VLLM_PID" 2>/dev/null || true
        [[ -n "${CF_PID:-}"   ]] && kill -SIGTERM "$CF_PID"   2>/dev/null || true
        sleep 3

        echo "=== vLLM Log (last 30 lines) ==="
        tail -30 /tmp/vllm.log 2>/dev/null || echo "(empty)"

    - name: 📤 Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vllm-logs-${{ github.run_id }}
        path: /tmp/vllm.log
        retention-days: 3
