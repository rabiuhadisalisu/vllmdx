# ============================================================
#  vLLM Server — GitHub Actions
#  Auto-detects hardware, launches vLLM (or llama-cpp fallback)
#  and exposes via Cloudflare Tunnel until timeout.
#
#  Hard limit: GitHub kills jobs at 6 hours.
#  This workflow self-terminates at SESSION_HOURS (default 5.75h).
#
#  Required Secrets (Settings → Secrets → Actions):
#    HF_TOKEN          — HuggingFace token (gated models)
#    CF_TUNNEL_TOKEN   — (optional) Cloudflare named tunnel token
#    VLLM_API_KEY      — (optional) Bearer auth for endpoint
#
#  Trigger: Actions tab → Run workflow
# ============================================================

name: 🚀 vLLM LLM Server

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "HuggingFace model ID"
        required: false
        default: "Qwen/Qwen2.5-1.5B-Instruct"
        type: string
      max_model_len:
        description: "Max context length in tokens"
        required: false
        default: "2048"
        type: string
      session_hours:
        description: "Session length in hours (max 5.75)"
        required: false
        default: "5.75"
        type: string
      tunnel_mode:
        description: "Cloudflare tunnel type"
        required: false
        default: "quick"
        type: choice
        options:
          - quick
          - named

env:
  MODEL_ID:      ${{ github.event.inputs.model_id      || 'Qwen/Qwen2.5-1.5B-Instruct' }}
  MAX_MODEL_LEN: ${{ github.event.inputs.max_model_len || '2048' }}
  SESSION_HOURS: ${{ github.event.inputs.session_hours || '5.75' }}
  TUNNEL_MODE:   ${{ github.event.inputs.tunnel_mode   || 'quick' }}
  VLLM_PORT:     8000
  # ── CRITICAL: must be set at workflow level so vllm config.__post_init__
  #    sees it before CLI arg parsing even begins. Without this vLLM crashes
  #    with "Failed to infer device type" on CPU-only runners.
  VLLM_TARGET_DEVICE: cpu

jobs:
  serve:
    name: "🤖 LLM Server (${{ github.event.inputs.model_id || 'Qwen2.5-1.5B' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6h hard cap — we self-terminate at SESSION_HOURS

    steps:

    # ── 0. Session info ───────────────────────────────────────────────────────
    - name: 📋 Session Info
      run: |
        set -euo pipefail

        echo "=================================================="
        echo "  vLLM CPU Server — GitHub Actions"
        echo "=================================================="
        echo "  Model         : $MODEL_ID"
        echo "  Max ctx len   : $MAX_MODEL_LEN tokens"
        echo "  Session limit : ${SESSION_HOURS}h"
        echo "  Runner OS     : $(uname -srm)"
        echo "  CPU           : $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
        echo "  CPU cores     : $(nproc)"
        echo "  RAM total     : $(free -h | awk '/^Mem:/{print $2}')"
        echo "  Disk free     : $(df -h / | awk 'NR==2{print $4}')"
        echo "  AVX support   : $(grep -m1 -oP 'avx512[a-z]*|avx2|avx' /proc/cpuinfo || echo 'none')"
        echo "=================================================="

        # Session timeout in seconds
        TIMEOUT_SECS=$(echo "$SESSION_HOURS * 3600" | bc | cut -d. -f1)
        echo "TIMEOUT_SECS=$TIMEOUT_SECS" >> $GITHUB_ENV
        echo "  Auto-shutdown : ${TIMEOUT_SECS}s"

        # Thread math — reserve 2 cores for HTTP server layer
        TOTAL_CORES=$(nproc)
        INFERENCE_CORES=$((TOTAL_CORES > 2 ? TOTAL_CORES - 2 : 1))
        RAM_GB=$(free -g | awk '/^Mem:/{print $2}')
        KV_CACHE_GB=$((RAM_GB > 3 ? RAM_GB / 3 : 1))

        echo "TOTAL_CORES=$TOTAL_CORES"               >> $GITHUB_ENV
        echo "INFERENCE_CORES=$INFERENCE_CORES"       >> $GITHUB_ENV
        echo "KV_CACHE_GB=$KV_CACHE_GB"               >> $GITHUB_ENV
        echo "BACKEND_ENGINE=vllm"                    >> $GITHUB_ENV

        echo "  Inference threads : $INFERENCE_CORES / $TOTAL_CORES"
        echo "  KV cache budget   : ${KV_CACHE_GB}GB"

    # ── 1. Checkout ───────────────────────────────────────────────────────────
    - name: 📥 Checkout
      uses: actions/checkout@v4

    # ── 2. Python ─────────────────────────────────────────────────────────────
    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ── 3. Cache pip ──────────────────────────────────────────────────────────
    - name: 🗃️ Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-vllm-cpu-torch-cpu-v3
        restore-keys: |
          ${{ runner.os }}-pip-vllm-cpu-torch-cpu-
          ${{ runner.os }}-pip-vllm-cpu-

    # ── 4. Cache HuggingFace weights ──────────────────────────────────────────
    - name: 🗃️ Cache HuggingFace weights
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ env.MODEL_ID }}-len${{ env.MAX_MODEL_LEN }}
        restore-keys: |
          hf-${{ env.MODEL_ID }}-

    # ── 5. System dependencies ────────────────────────────────────────────────
    - name: 📦 System Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          curl wget jq bc numactl libnuma-dev libgomp1 2>/dev/null
        echo "[✓] System deps ready"

    # ── 6. Install vLLM for CPU ───────────────────────────────────────────────
    #
    #  Why this is hard:
    #  - vLLM publishes CPU wheels with a +cpu local version suffix on GitHub
    #    Releases. PEP 440 blocks local-version suffixes on PyPI, so pip's
    #    resolver rejects every version of vllm-cpu when it tries to resolve
    #    from the index — producing ResolutionImpossible.
    #  - The community vllm-cpu PyPI package re-wraps the same wheel but pip
    #    still conflicts when a CUDA torch is already present.
    #  - The fix: pre-pin torch to its CPU build FIRST so the resolver never
    #    sees a CUDA torch, then install vLLM by direct wheel URL.
    #
    #  IMPORTANT: never use  if cmd | tee file  — the pipe returns tee's exit
    #  code (always 0), masking pip failures. Use  cmd && flag=true || true.
    # ─────────────────────────────────────────────────────────────────────────
    - name: ⚙️ Install vLLM for CPU
      env:
        VLLM_TARGET_DEVICE: cpu
      run: |
        set -uo pipefail

        pip install --upgrade pip setuptools wheel -q
        echo "[→] Starting vLLM CPU install..."
        echo ""

        INSTALLED=false
        ARCH=$(uname -m)   # x86_64 or aarch64

        # ── Pre-step: pin PyTorch to CPU build ────────────────────────────────
        # This is the root cause of ResolutionImpossible — pip sees a CUDA
        # torch already present and can't reconcile it with vllm-cpu's CPU
        # torch requirement. Installing CPU torch first locks the resolver.
        echo "[pre] Pre-installing PyTorch CPU build to pin resolver..."
        pip install \
          torch torchvision torchaudio \
          --index-url https://download.pytorch.org/whl/cpu \
          -q \
          && echo "[✓] PyTorch (CPU) pre-pinned" \
          || echo "[!] PyTorch CPU pre-pin failed — continuing anyway"

        echo ""

        # ── Method 1: upstream official CPU wheel via direct GitHub URL ───────
        # Most reliable. Bypasses PyPI entirely so PEP 440 +cpu suffix issue
        # never comes up. Resolver is already happy because torch is pinned.
        echo "[1/3] Upstream vLLM CPU wheel (direct GitHub Releases URL)..."

        LATEST_VER=$(curl -sf \
          "https://api.github.com/repos/vllm-project/vllm/releases/latest" \
          | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))" \
          2>/dev/null || echo "0.29.0")
        echo "      Latest vLLM : v${LATEST_VER}"
        echo "      Arch        : ${ARCH}"

        WHEEL_URL="https://github.com/vllm-project/vllm/releases/download/v${LATEST_VER}/vllm-${LATEST_VER}+cpu-cp38-abi3-manylinux_2_28_${ARCH}.whl"
        echo "      Wheel URL   : $WHEEL_URL"

        pip install "$WHEEL_URL" \
          --extra-index-url https://download.pytorch.org/whl/cpu \
          -q \
          && INSTALLED=true \
          && echo "[✓] Method 1 succeeded: upstream wheel v${LATEST_VER}" \
          || echo "[✗] Method 1 failed"

        # ── Method 2: community vllm-cpu with torch constraint ────────────────
        # Only attempted if method 1 fails. Writes a constraints file using
        # the already-installed torch version to prevent version conflicts.
        if [[ "$INSTALLED" == "false" ]]; then
          echo ""
          echo "[2/3] vllm-cpu (PyPI community package) with torch constraint..."

          TORCH_VER=$(python3 -c "import torch; print(torch.__version__)" 2>/dev/null || echo "")

          if [[ -n "$TORCH_VER" ]]; then
            echo "torch==${TORCH_VER}" > /tmp/torch_constraint.txt
            echo "      Constraining torch==${TORCH_VER}"

            pip install vllm-cpu \
              --constraint /tmp/torch_constraint.txt \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -q \
              && INSTALLED=true \
              && echo "[✓] Method 2 succeeded: vllm-cpu (constrained)" \
              || echo "[✗] Method 2 failed"
          else
            echo "      Skipping — no torch version to constrain against"
          fi
        fi

        # ── Method 3: llama-cpp-python OpenAI server (nuclear fallback) ───────
        # Zero dependency conflicts — pre-built binary, no torch required.
        # Provides identical OpenAI API surface:
        #   GET  /health
        #   GET  /v1/models
        #   POST /v1/chat/completions
        #   POST /v1/completions
        # Note: requires a GGUF model. If MODEL_ID is not a GGUF repo,
        # the launch step will attempt to find a bartowski GGUF variant.
        if [[ "$INSTALLED" == "false" ]]; then
          echo ""
          echo "[3/3] llama-cpp-python[server] (guaranteed fallback)..."

          pip install \
            "llama-cpp-python[server]" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            -q \
            && INSTALLED=true \
            && echo "[✓] Method 3 succeeded: llama-cpp-python" \
            && echo "BACKEND_ENGINE=llamacpp" >> $GITHUB_ENV \
            || { echo "[✗] ALL 3 methods failed — cannot continue"; exit 1; }
        fi

        # ── Verify: actually import the installed module ───────────────────────
        # Done in a heredoc so the VLLM_TARGET_DEVICE env var is visible
        # to the Python process and we get a clean failure message.
        echo ""
        echo "=== Import Verification ==="

        if [[ "${BACKEND_ENGINE:-vllm}" == "vllm" ]]; then
          python3 - <<'PYEOF'
import os, sys
os.environ["VLLM_TARGET_DEVICE"] = "cpu"
try:
    import vllm
    print(f"[✓] vLLM {vllm.__version__} imported successfully")
except Exception as e:
    print(f"[✗] vLLM import failed: {e}", file=sys.stderr)
    sys.exit(1)
PYEOF
        else
          python3 - <<'PYEOF'
import sys
try:
    import llama_cpp
    print(f"[✓] llama-cpp-python {llama_cpp.__version__} imported successfully")
except Exception as e:
    print(f"[✗] llama-cpp-python import failed: {e}", file=sys.stderr)
    sys.exit(1)
PYEOF
        fi

        echo ""
        echo "=== Installed package versions ==="
        pip show vllm vllm-cpu llama-cpp-python 2>/dev/null \
          | grep -E "^(Name|Version):" || true

    # ── 7. Install cloudflared ────────────────────────────────────────────────
    - name: ☁️ Install cloudflared
      run: |
        set -euo pipefail

        LATEST=$(curl -sf \
          "https://api.github.com/repos/cloudflare/cloudflared/releases/latest" \
          | jq -r .tag_name)
        ARCH=$(uname -m)
        [[ "$ARCH" == "aarch64" ]] && CF_ARCH="arm64" || CF_ARCH="amd64"
        URL="https://github.com/cloudflare/cloudflared/releases/download/${LATEST}/cloudflared-linux-${CF_ARCH}"

        echo "[→] Downloading cloudflared ${LATEST} (${CF_ARCH})..."
        curl -fsSL "$URL" -o /usr/local/bin/cloudflared
        chmod +x /usr/local/bin/cloudflared
        echo "[✓] $(cloudflared --version)"

    # ── 8. Start LLM server ───────────────────────────────────────────────────
    - name: 🚀 Start LLM Server
      env:
        HF_TOKEN:                     ${{ secrets.HF_TOKEN }}
        HUGGING_FACE_HUB_TOKEN:       ${{ secrets.HF_TOKEN }}
        VLLM_API_KEY:                 ${{ secrets.VLLM_API_KEY }}
        # Device env var — read by vllm/config/device.py __post_init__
        # BEFORE CLI argument parsing. Mandatory on CPU-only runners.
        VLLM_TARGET_DEVICE:           cpu
        # CPU performance vars
        OMP_NUM_THREADS:              ${{ env.INFERENCE_CORES }}
        MKL_NUM_THREADS:              ${{ env.INFERENCE_CORES }}
        VLLM_CPU_KVCACHE_SPACE:       ${{ env.KV_CACHE_GB }}
        VLLM_CPU_NUM_OF_RESERVED_CPU: "2"
      run: |
        set -uo pipefail

        if [[ "${BACKEND_ENGINE:-vllm}" == "llamacpp" ]]; then
          # ── llama-cpp-python server ──────────────────────────────────────
          echo "[→] Starting llama-cpp-python server..."
          echo "    Note: MODEL_ID should be a GGUF repo."
          echo "    If not, attempting bartowski GGUF variant automatically."

          # Auto-map non-GGUF HF model IDs to likely GGUF repos
          if [[ "$MODEL_ID" != *"GGUF"* ]] && [[ "$MODEL_ID" != *".gguf"* ]]; then
            MODEL_NAME=$(echo "$MODEL_ID" | sed 's|.*/||')
            GGUF_REPO="bartowski/${MODEL_NAME}-GGUF"
            echo "[!] Remapping $MODEL_ID → $GGUF_REPO"
            LAUNCH_MODEL="$GGUF_REPO"
          else
            LAUNCH_MODEL="$MODEL_ID"
          fi

          python3 -m llama_cpp.server \
            --model "$LAUNCH_MODEL" \
            --host 0.0.0.0 \
            --port "$VLLM_PORT" \
            --n_ctx "$MAX_MODEL_LEN" \
            --n_threads "$INFERENCE_CORES" \
            --chat_format chatml \
            > /tmp/vllm.log 2>&1 &

        else
          # ── vLLM server ──────────────────────────────────────────────────
          echo "[→] Starting vLLM CPU server..."
          echo "    VLLM_TARGET_DEVICE        = cpu"
          echo "    OMP_NUM_THREADS           = $INFERENCE_CORES"
          echo "    VLLM_CPU_KVCACHE_SPACE    = ${KV_CACHE_GB}GB"
          echo "    Model                     = $MODEL_ID"
          echo "    Max context length        = $MAX_MODEL_LEN"
          echo ""

          vllm serve "$MODEL_ID" \
            --device cpu \
            --dtype bfloat16 \
            --host 0.0.0.0 \
            --port "$VLLM_PORT" \
            --max-model-len "$MAX_MODEL_LEN" \
            --trust-remote-code \
            --enable-prefix-caching \
            --uvicorn-log-level warning \
            --served-model-name "$(echo "$MODEL_ID" | sed 's|.*/||')" \
            $( [[ -n "${VLLM_API_KEY:-}" ]] && echo "--api-key $VLLM_API_KEY" ) \
            > /tmp/vllm.log 2>&1 &
        fi

        VLLM_PID=$!
        echo "VLLM_PID=$VLLM_PID" >> $GITHUB_ENV
        echo "[✓] Server PID: $VLLM_PID — waiting for health..."

    # ── 9. Wait for health ────────────────────────────────────────────────────
    - name: ⏳ Wait for Server Health
      run: |
        set -uo pipefail

        echo "[→] Polling http://localhost:${VLLM_PORT}/health ..."
        echo "    CPU model load can take 3–8 minutes — please wait."
        echo ""

        MAX_WAIT=600   # 10 min — generous for slow CPU model load
        INTERVAL=10
        ELAPSED=0

        while true; do
          # Check process is alive BEFORE hitting the endpoint
          if ! kill -0 "$VLLM_PID" 2>/dev/null; then
            echo ""
            echo "[✗] Server process died. Full log:"
            echo "────────────────────────────────────"
            cat /tmp/vllm.log
            echo "────────────────────────────────────"
            exit 1
          fi

          if curl -sf "http://localhost:$VLLM_PORT/health" &>/dev/null; then
            echo ""
            echo "[✓] Server healthy after ${ELAPSED}s"
            break
          fi

          if [[ $ELAPSED -ge $MAX_WAIT ]]; then
            echo ""
            echo "[✗] Health timeout after ${MAX_WAIT}s. Last 40 lines:"
            echo "────────────────────────────────────"
            tail -40 /tmp/vllm.log
            echo "────────────────────────────────────"
            exit 1
          fi

          # Show last log line inline so progress is visible
          LAST_LINE=$(tail -1 /tmp/vllm.log 2>/dev/null \
            | sed 's/INFO [0-9-]* [0-9:]* //' \
            | cut -c1-80 || echo "")
          printf "  [%3ds/%ds] %s\r" "$ELAPSED" "$MAX_WAIT" "$LAST_LINE"

          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done

        echo ""
        echo "=== Loaded Models ==="
        curl -s "http://localhost:$VLLM_PORT/v1/models" \
          | python3 -m json.tool 2>/dev/null \
          || curl -s "http://localhost:$VLLM_PORT/v1/models"

    # ── 10. Start Cloudflare Tunnel ───────────────────────────────────────────
    - name: 🌐 Start Cloudflare Tunnel
      env:
        CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      run: |
        set -uo pipefail

        TUNNEL_URL=""

        if [[ "$TUNNEL_MODE" == "named" && -n "${CF_TUNNEL_TOKEN:-}" ]]; then
          # Named tunnel — uses your Zero Trust domain (permanent URL)
          echo "[→] Starting named Cloudflare Tunnel..."
          cloudflared tunnel --no-autoupdate run \
            --token "$CF_TUNNEL_TOKEN" \
            > /tmp/cloudflared.log 2>&1 &
          CF_PID=$!
          sleep 8
          TUNNEL_URL="(your configured Cloudflare hostname)"
          echo "[✓] Named tunnel running (PID $CF_PID)"

        else
          # Quick tunnel — free, no account needed
          # URL format: https://xxxx-xxxx-xxxx.trycloudflare.com
          echo "[→] Starting Cloudflare Quick Tunnel..."
          cloudflared tunnel --no-autoupdate \
            --url "http://localhost:$VLLM_PORT" \
            > /tmp/cloudflared.log 2>&1 &
          CF_PID=$!

          # Poll log for the assigned URL (up to 45s)
          for i in $(seq 1 45); do
            TUNNEL_URL=$(grep -oP \
              'https://[a-z0-9\-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log 2>/dev/null | head -1 || true)
            [[ -n "$TUNNEL_URL" ]] && break
            sleep 1
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "[!] Could not extract tunnel URL from log. cloudflared log:"
            cat /tmp/cloudflared.log
            TUNNEL_URL="(check cloudflared log above)"
          fi
        fi

        echo "CF_PID=$CF_PID"           >> $GITHUB_ENV
        echo "TUNNEL_URL=$TUNNEL_URL"   >> $GITHUB_ENV

        # Print the endpoint prominently — this is what you need to copy
        echo ""
        echo "╔══════════════════════════════════════════════════════════╗"
        echo "║               🌐  LLM SERVER IS LIVE                    ║"
        echo "╠══════════════════════════════════════════════════════════╣"
        printf "║  %-56s  ║\n" "Public URL  : $TUNNEL_URL"
        printf "║  %-56s  ║\n" "API base    : $TUNNEL_URL/v1"
        printf "║  %-56s  ║\n" "Health      : $TUNNEL_URL/health"
        printf "║  %-56s  ║\n" "Model list  : $TUNNEL_URL/v1/models"
        printf "║  %-56s  ║\n" "Engine      : ${BACKEND_ENGINE:-vllm}"
        printf "║  %-56s  ║\n" "Model       : $MODEL_ID"
        echo "╠══════════════════════════════════════════════════════════╣"
        echo "║  Example:                                                ║"
        echo "║  curl $TUNNEL_URL/v1/chat/completions \\                 ║"
        echo "║    -H 'Content-Type: application/json' \\                ║"
        echo "║    -d '{\"model\":\"...\",\"messages\":[{...}]}'           ║"
        echo "╚══════════════════════════════════════════════════════════╝"

    # ── 11. Keep-alive loop ───────────────────────────────────────────────────
    #
    #  Holds the job alive until SESSION_HOURS expires.
    #  Prints a heartbeat every 5 minutes with timing, health, and URL.
    #  Watchdog auto-restarts vLLM if it crashes.
    # ─────────────────────────────────────────────────────────────────────────
    - name: 🔄 Keep-Alive (auto-shutdown at timeout)
      env:
        VLLM_TARGET_DEVICE:           cpu
        OMP_NUM_THREADS:              ${{ env.INFERENCE_CORES }}
        MKL_NUM_THREADS:              ${{ env.INFERENCE_CORES }}
        VLLM_CPU_KVCACHE_SPACE:       ${{ env.KV_CACHE_GB }}
        VLLM_CPU_NUM_OF_RESERVED_CPU: "2"
        HF_TOKEN:                     ${{ secrets.HF_TOKEN }}
        HUGGING_FACE_HUB_TOKEN:       ${{ secrets.HF_TOKEN }}
        VLLM_API_KEY:                 ${{ secrets.VLLM_API_KEY }}
      run: |
        set -uo pipefail

        echo "[→] Keep-alive started."
        echo "    Session limit : ${SESSION_HOURS}h (${TIMEOUT_SECS}s)"
        echo "    Heartbeat     : every 5 minutes"
        echo "    Watchdog      : auto-restart on crash"
        echo ""

        START=$(date +%s)
        LAST_HB=0
        RESTART_COUNT=0

        while true; do
          NOW=$(date +%s)
          ELAPSED=$((NOW - START))
          REMAINING=$((TIMEOUT_SECS - ELAPSED))

          # ── Graceful shutdown when time is up ───────────────────────────
          if [[ $REMAINING -le 0 ]]; then
            echo ""
            echo "⏰ Session limit reached (${SESSION_HOURS}h) — shutting down gracefully."
            break
          fi

          # ── Heartbeat every 5 minutes ───────────────────────────────────
          if [[ $((NOW - LAST_HB)) -ge 300 ]]; then
            E=$(printf "%02d:%02d:%02d" \
              $((ELAPSED/3600)) $(( (ELAPSED%3600)/60 )) $((ELAPSED%60)))
            R=$(printf "%02d:%02d:%02d" \
              $((REMAINING/3600)) $(( (REMAINING%3600)/60 )) $((REMAINING%60)))

            HEALTH_ICON="❌ DOWN"
            curl -sf "http://localhost:$VLLM_PORT/health" &>/dev/null \
              && HEALTH_ICON="✅ UP"

            RAM_USED=$(free -h | awk '/^Mem:/{print $3 " / " $2}')
            REQUESTS=$(grep -c "POST /v1/" /tmp/vllm.log 2>/dev/null || echo "0")

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ⏱  Elapsed      : $E"
            echo "  ⏳  Remaining    : $R"
            echo "  🤖  Server       : $HEALTH_ICON"
            echo "  🔁  Restarts     : $RESTART_COUNT"
            echo "  📊  Requests     : ~$REQUESTS served"
            echo "  💾  RAM          : $RAM_USED"
            echo "  🌐  Endpoint     : $TUNNEL_URL/v1"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "  📡 COPY THIS → $TUNNEL_URL/v1"
            echo ""

            LAST_HB=$NOW
          fi

          # ── Watchdog: auto-restart if vLLM process died ─────────────────
          if ! kill -0 "$VLLM_PID" 2>/dev/null; then
            RESTART_COUNT=$((RESTART_COUNT + 1))
            echo "[!] Server process gone (restart #${RESTART_COUNT}) — restarting..."

            if [[ "${BACKEND_ENGINE:-vllm}" == "llamacpp" ]]; then
              python3 -m llama_cpp.server \
                --model "$MODEL_ID" \
                --host 0.0.0.0 \
                --port "$VLLM_PORT" \
                --n_ctx "$MAX_MODEL_LEN" \
                --n_threads "$INFERENCE_CORES" \
                --chat_format chatml \
                >> /tmp/vllm.log 2>&1 &
            else
              vllm serve "$MODEL_ID" \
                --device cpu \
                --dtype bfloat16 \
                --host 0.0.0.0 \
                --port "$VLLM_PORT" \
                --max-model-len "$MAX_MODEL_LEN" \
                --trust-remote-code \
                --enable-prefix-caching \
                --uvicorn-log-level warning \
                --served-model-name "$(echo "$MODEL_ID" | sed 's|.*/||')" \
                >> /tmp/vllm.log 2>&1 &
            fi

            VLLM_PID=$!
            echo "VLLM_PID=$VLLM_PID" >> $GITHUB_ENV
            echo "[✓] Restarted — new PID: $VLLM_PID"

            # Brief wait for restart
            sleep 30
          fi

          sleep 15
        done

    # ── 12. Graceful shutdown & logs ──────────────────────────────────────────
    - name: 🛑 Shutdown & Collect Logs
      if: always()
      run: |
        echo "[→] Stopping all services..."

        # Stop vLLM / llama-cpp
        if [[ -n "${VLLM_PID:-}" ]]; then
          kill -SIGTERM "$VLLM_PID" 2>/dev/null || true
          sleep 5
          kill -SIGKILL "$VLLM_PID" 2>/dev/null || true
          echo "[✓] Server stopped"
        fi

        # Stop cloudflared
        if [[ -n "${CF_PID:-}" ]]; then
          kill -SIGTERM "$CF_PID" 2>/dev/null || true
          echo "[✓] Cloudflare tunnel stopped"
        fi

        echo ""
        echo "=== vLLM / Server Log (last 50 lines) ==="
        echo "────────────────────────────────────────────"
        tail -50 /tmp/vllm.log 2>/dev/null || echo "(no log)"
        echo "────────────────────────────────────────────"

        echo ""
        echo "=== Cloudflare Tunnel Log (last 20 lines) ==="
        echo "────────────────────────────────────────────"
        tail -20 /tmp/cloudflared.log 2>/dev/null || echo "(no log)"
        echo "────────────────────────────────────────────"

    # ── 13. Upload logs as artifact ───────────────────────────────────────────
    - name: 📤 Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vllm-server-logs-${{ github.run_id }}
        path: |
          /tmp/vllm.log
          /tmp/cloudflared.log
        retention-days: 3
        if-no-files-found: ignore
